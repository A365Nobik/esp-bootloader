name: ESP-IDF Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build ESP32-S3
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
            submodules: recursive

      - name: Configure partition table
        run: cp partitions/16mb.csv partitions.csv

      - name: Build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-firmware
          path: |
            build/*.bin
            build/*.elf
            build/*.map
          if-no-files-found: error
